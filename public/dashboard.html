function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2600)}
async function post(path,body){
  const r=await fetch(path+(path.includes("?")?"&":"?")+"s="+encodeURIComponent(S),
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  if(!r.ok)throw new Error("failed");
  return r.json();
}
// price line: "₹50 / 150 g pack · 10 left"
function itemMeta(i){
  const bits=[];
  bits.push(money(i.price)+(i.unit?" / "+esc(i.unit):""));
  if(i.qty)bits.push(`${esc(i.qty)} ${esc(t("left"))}`);
  return bits.join(" · ");
}

async function toggleShop(){
  try{const r=await post("/api/shop/open",{open:!data.shop.open});
    data.shop.open=r.open;toast(r.open?t("openMsg"):t("pausedMsg"));paint()}
  catch(e){toast("Could not change that.")}
}
async function orderAction(id,status){
  try{await post("/api/orders/"+id,{status});toast(t("saved"));await load()}catch(e){toast("Could not change that.")}
}
async function markPaid(id){
  try{await post("/api/orders/"+id,{paid:true});toast(t("saved"));await load()}catch(e){toast("Could not change that.")}
}
function editItem(id){
  const i=data.items.find(x=>x.id===id);if(!i)return;
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="dialog-head"><h2>${esc(t("editItem"))}</h2>
    <button class="circle-btn" id="x" aria-label="${esc(t("cancel"))}">${icon("close")}</button></div>
    <label>${esc(t("name"))}<input id="f_name" value="${esc(i.name)}" maxlength="60"></label>
    <div class="form-grid">
      <label>${esc(t("price"))}<input id="f_price" type="number" min="0" step="1" value="${esc(i.price)}"></label>
      <label>${esc(t("qty"))}<input id="f_qty" type="number" min="0" step="1" value="${esc(i.qty??"")}"></label>
    </div>
    <label>${esc(t("unit"))}<input id="f_unit" value="${esc(i.unit||"")}" maxlength="40" placeholder="250 g pack"></label>
    <div class="form-actions"><button class="btn secondary" id="rm">${esc(t("remove"))}</button>
      <button class="btn" id="sv">${esc(t("save"))}</button></div>`;
  m.showModal();
  m.querySelector("#x").onclick=()=>m.close();
  m.querySelector("#sv").onclick=async()=>{
    const body={name:m.querySelector("#f_name").value.trim(),
      price:Number(m.querySelector("#f_price").value),
      unit:m.querySelector("#f_unit").value.trim()||null,
      qty:m.querySelector("#f_qty").value===""?null:Number(m.querySelector("#f_qty").value)};
    if(!body.name||!(body.price>=0))return toast("Check the name and price.");
    try{await post("/api/items/"+id,body);m.close();toast(t("saved"));await load()}catch(e){toast("Could not save.")}};
  m.querySelector("#rm").onclick=async()=>{
    try{await post("/api/items/"+id,{remove:true});m.close();toast(t("removed"));await load()}catch(e){toast("Could not remove.")}};
}

function stats(){
  const o=data.orders,pend=o.filter(x=>["new","accepted","ready"].includes(x.status));
  const paid=o.filter(x=>x.paid).reduce((a,x)=>a+(x.total||0),0);
  const due=o.filter(x=>!x.paid&&x.status!=="declined").reduce((a,x)=>a+(x.total||0),0);
  return `<div class="stats">
    <div class="stat"><p>${esc(t("pending"))}</p><strong>${pend.length}</strong></div>
    <div class="stat"><p>${esc(t("listed"))}</p><strong>${data.items.length}</strong></div>
    <div class="stat"><p>${esc(t("received"))}</p><strong>${money(paid)}</strong></div>
    <div class="stat"><p>${esc(t("due"))}</p><strong>${money(due)}</strong></div></div>`;
}

function chart(){
  const by={};
  data.orders.forEach(o=>{const d=(o.ts||"").slice(0,10);if(d)by[d]=(by[d]||0)+(o.total||0)});
  const days=Object.keys(by).sort().slice(-7);
  if(!days.length)return `<p class="muted">${esc(t("none"))}</p>`;
  const max=Math.max(...days.map(d=>by[d]));
  return `<div class="bar-chart">${days.map(d=>`<div class="bar-col"><span>${money(by[d])}</span>
    <div class="bar" style="height:${Math.max(6,(by[d]/max)*100)}%"></div><span>${esc(d.slice(5))}</span></div>`).join("")}</div>`;
}

    <section class="panel"><div class="section-head"><h2>${esc(t("brief"))}</h2><small class="muted">Muse Spark</small></div>
      <p id="brief" style="margin:0">${esc(briefText||"…")}</p></section>
    <section class="panel"><div class="section-head"><h2>${esc(t("recent"))}</h2>
      <button class="text-btn" data-go="orders">${esc(t("all"))}</button></div>
      ${pend.slice(0,3).map(orderRow).join("")||`<p class="muted">${esc(t("caught"))}</p>`}</section>
    <section class="panel"><div class="section-head"><h2>${esc(t("todays"))}</h2>
      <a class="text-btn" href="/#shop-${esc(s.token)}">${esc(t("pub"))}</a></div>
      ${data.items.length?`<div class="products">${data.items.slice(0,3).map(productCard).join("")}</div>`:`<p class="muted">${esc(t("none"))}</p>`}</section>
    </div><div>
    <section class="panel"><div class="section-head"><h2>${esc(t("doWhat"))}</h2></div>
      <div class="action-grid">
        <button class="action-tile" data-tg="1">${icon("mic")}<span>${esc(t("speak"))}</span></button>
        <button class="action-tile" data-go="orders">${icon("bag")}<span>${esc(t("seeOrders"))}</span></button>
        <button class="action-tile" id="toggleShop2">${icon("clock")}<span>${esc(data.shop.open?t("pause"):t("reopen"))}</span></button>
        <button class="action-tile" data-go="money">${icon("wallet")}<span>${esc(t("checkMoney"))}</span></button>
      </div></section>
    <div class="tip"><h3>✦ ${esc(t("tipH"))}</h3><p>${esc(t("tipP"))}</p></div>
  </div></div>`},
 orders(){const f=[["all",t("all")],["new",t("fNew")],["accepted",t("fPrep")],["ready",t("fReady")],["completed",t("fDone")]];
  const list=data.orders.filter(o=>filter==="all"||o.status===filter);
  return `<div class="page-heading"><div><h1>${esc(t("orders"))}</h1><p class="sub">${esc(t("storySub"))}</p></div></div>
  <div class="tabs">${f.map(([k,l])=>`<button class="${filter===k?"active":""}" data-f="${k}">${esc(l)} ${k==="all"?data.orders.length:data.orders.filter(o=>o.status===k).length}</button>`).join("")}</div>
  ${list.map(orderCard).join("")||`<div class="panel empty">${esc(t("none"))}</div>`}`},
 products(){return `<div class="page-heading"><div><h1>${esc(t("products"))}</h1><p class="sub">${esc(t("todays"))}</p></div>
  <a class="btn secondary" href="/#shop-${esc(data.shop.token)}">${esc(t("pub"))}</a></div>
  <section class="panel">${data.items.length?`<div class="products">${data.items.map(productCard).join("")}</div>`:`<p class="empty">${esc(t("none"))}</p>`}
  <p class="notice">${esc(t("helpP"))}</p></section>`},
 money(){const o=data.orders.filter(x=>x.status!=="declined");
  return `<div class="page-heading"><div><h1>${esc(t("money"))}</h1><p class="sub">${esc(t("book"))}</p></div></div>
  ${stats()}<section class="panel"><div class="section-head"><h2>${esc(t("book"))}</h2></div>
  <div class="notice">${esc(t("payNote"))}</div>
  ${o.map(x=>`<div class="ledger-row"><div><strong>${esc(x.buyer_name)} · #MB${x.id}</strong>
    <p>${esc(x.qty)} × ${esc(x.item_name)} · ${x.paid?esc(t("yes")):esc(t("no"))}</p></div>
    <div style="text-align:right"><strong>${money(x.total)}</strong>
    ${!x.paid?`<div><button class="text-btn" data-paid="${x.id}">${esc(t("recordPaid"))}</button></div>`:""}</div></div>`).join("")
    ||`<p class="muted">${esc(t("none"))}</p>`}</section>`},
 story(){const done=data.orders.filter(o=>o.status==="completed");
  const buyers=new Set(data.orders.map(o=>o.buyer_name)).size;
  const days=new Set(data.orders.map(o=>(o.ts||"").slice(0,10)).filter(Boolean)).size;
  return `<div class="page-heading"><div><h1>${esc(t("story"))}</h1><p class="sub">${esc(t("storySub"))}</p></div>
    <button class="btn secondary" id="print">${icon("download")}PDF</button></div>
  <section class="passport"><p class="eyebrow">${esc(t("passport"))}</p>
    <h2>${esc(data.shop.business_name||"")}</h2>
    <p>${esc([term(data.shop.category),data.shop.area,data.shop.region].filter(Boolean).join(" · "))}</p>
    <div class="passport-grid"><div><strong>${done.length}</strong><span>${esc(t("done"))}</span></div>
    <div><strong>${buyers}</strong><span>${esc(t("buyers"))}</span></div>
    <div><strong>${days}</strong><span>${esc(t("days"))}</span></div></div></section>
  <section class="panel"><div class="section-head"><h2>${esc(t("weekly"))}</h2><small class="muted" id="reviewBy"></small></div>
    <p id="review" style="margin:0;white-space:pre-line">${esc(reviewText||"")}</p>
    ${reviewText?"":`<button class="btn" id="getReview">${esc(t("getReview"))}</button>`}</section>
  <section class="panel"><div class="section-head"><h2>${esc(t("sales"))}</h2></div>${chart()}</section>
  <div class="notice">${esc(t("disc"))}</div>`}};

function wire(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{view=b.dataset.go;location.hash=view;paint()});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editItem(Number(b.dataset.edit)));
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>orderAction(Number(b.dataset.id),b.dataset.act));
  document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>markPaid(Number(b.dataset.paid)));
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;paint()});
  document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>toast(t("helpP")));
  const p=document.getElementById("print");if(p)p.onclick=()=>window.print();
  const rb=document.getElementById("reviewBy");if(rb&&reviewModel)rb.textContent=reviewModel;
  const gr=document.getElementById("getReview");
  if(gr)gr.onclick=async()=>{
    gr.disabled=true;document.getElementById("review").textContent=t("reviewing");
    try{const r=await fetch("/api/review?lang="+lang+"&s="+encodeURIComponent(S));const j=await r.json();
      if(!r.ok)throw new Error(j.error);
      reviewText=j.text;reviewModel=j.model==="muse-wonder-1.0"?"Muse Wonder":j.model?"Muse Spark":"";paint()}
    catch(e){document.getElementById("review").textContent=e.message||"Not available right now.";gr.disabled=false}};
  ["toggleShop","toggleShop2"].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=toggleShop});
}
function renderNav(){
  const n=data.orders.filter(o=>["new","accepted","ready"].includes(o.status)).length;
  const ic={home:"home",orders:"bag",products:"box",money:"wallet",story:"chart"};
  document.getElementById("nav").innerHTML=["home","orders","products","money","story"].map(v=>
    `<button class="${v===view?"active":""}" data-v="${v}">${icon(ic[v])}${esc(t(v))}${v==="orders"&&n?`<span class="count">${n}</span>`:""}</button>`).join("");
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;location.hash=view;paint()});
  document.getElementById("lang").innerHTML=["en","kn"].map(l=>
    `<button class="${l===lang?"selected":""}" data-l="${l}">${l==="en"?"English":"ಕನ್ನಡ"}</button>`).join("");
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{
    if(b.dataset.l===lang)return;
    lang=b.dataset.l;localStorage.setItem("mb_lang",lang);briefText="";reviewText="";reviewModel="";paint();loadBrief()});
}
function paint(){
  const s=data.shop;
  document.getElementById("place").textContent=(s.area||s.region||"KARNATAKA").toUpperCase();
  document.getElementById("av").innerHTML=s.photo?`<img class="avatar" src="${esc(s.photo)}" alt="">`:esc((s.business_name||s.name||"?")[0]);
  document.getElementById("pname").textContent=s.business_name||s.name||"";
  document.getElementById("prole").textContent=term(s.role||"");
  document.getElementById("crumb").textContent=t(view);
  document.getElementById("helpTitle").textContent=t("help");
  document.getElementById("helpText").textContent=t("helpP");
  renderNav();
  document.getElementById("content").innerHTML=(views[view]||views.home)();
  wire();
}
async function loadBrief(){
  try{const b=await (await fetch("/api/brief?lang="+lang+"&s="+encodeURIComponent(S))).json();
    if(b.text){briefText=b.text;const el=document.getElementById("brief");if(el)el.textContent=b.text}}catch(e){}
}
async function load(){
  if(!S){document.getElementById("content").innerHTML='<p class="empty">Open this page from the link the bot sends with /dashboard.</p>';return}
  try{
    const r=await fetch("/api/me?s="+encodeURIComponent(S));
    if(!r.ok)throw 0;
    data=await r.json();paint();
    if(!briefText)loadBrief();
  }catch(e){if(!data)document.getElementById("content").innerHTML='<p class="empty">This link is not valid. Send /dashboard to the bot for a new one.</p>'}
}
addEventListener("hashchange",()=>{view=location.hash.slice(1)||"home";if(data)paint()});
load();setInterval(()=>{if(!document.getElementById("modal").open)load()},12000);
setInterval(loadBrief,120000);
</script></body></html>
